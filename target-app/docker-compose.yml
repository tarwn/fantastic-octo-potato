# No `depends_on: condition: service_healthy` here: older podman-compose doesn't honor it
# (spec 0005 C004). The app container waits-and-retries its DB connection instead
# (docker-entrypoint.sh); its own healthcheck reflects real readiness.
services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: bamboo_dev_root_password
      MYSQL_DATABASE: bambooinvoice
      MYSQL_USER: bamboo
      MYSQL_PASSWORD: bamboo_dev_password
    # BambooInvoice's CodeIgniter-era queries aren't ONLY_FULL_GROUP_BY-safe (non-aggregated
    # SELECT columns not in GROUP BY); MySQL 5.7 enables it by default and the app 500s. Drop
    # only that mode, keeping the rest of 5.7's default sql_mode (strict mode, zero-date/division
    # checks, etc.) intact.
    command: --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
    volumes:
      - target-app-mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bamboo", "-pbamboo_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    ports:
      - "8089:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/", "-o", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  target-app-mysql-data:
